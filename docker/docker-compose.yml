version: "3.9"

# ============================================================
# LungSight AI — Docker Compose (development + production)
# ============================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: lungsight_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       lungsight_db
      POSTGRES_USER:     lungs_user
      POSTGRES_PASSWORD: lungs_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lungs_user -d lungsight_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: lungsight_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (FastAPI) ────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: lungsight_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - DATABASE_URL=postgresql+asyncpg://lungs_user:lungs_pass@postgres:5432/lungsight_db
      - REDIS_URL=redis://redis:6379/0
      - DEVICE=cpu
      - SECRET_KEY=${SECRET_KEY:-lungs1ght-change-in-prod}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-jwt-change-in-prod}
      - ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
    volumes:
      - uploads:/app/uploads
      - reports:/app/reports/generated
      - models:/app/backend/models/weights
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ── Frontend (Next.js) ───────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=http://backend:8000
    container_name: lungsight_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy

  # ── Nginx (reverse proxy) ────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: lungsight_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  uploads:
  reports:
  models:
